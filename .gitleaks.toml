title = "dotfiles gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore local-only agent and git metadata"
paths = [
  '''(^|/)\.codex/''',
  '''(^|/)\.git/''',
]

[[allowlists]]
description = "Ignore machine-local override files that are excluded from git"
paths = [
  '''^config/acli/\.config/acli/env\.local$''',
  '''^config/zsh/\.config/zsh/lazy/60-elhub\.zsh$''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Ignore VS Code keyboard shortcuts that resemble generic API keys"
condition = "AND"
regexTarget = "line"
paths = ['''^config/vscode/\.config/Code/User/keybindings\.json$''']
regexes = ['''^\s*"key"\s*:\s*"[a-z0-9]+(?:\+[a-z0-9]+)+(?:\s+[a-z0-9]+(?:\+[a-z0-9]+)*)?",?\s*$''']
