# gh-dash configuration — cross-repo PR dashboard, launched inside the
# dedicated "github" herdr workspace (see config/herdr/herdr-github).
# Schema: https://dlvhdr.github.io/gh-dash/configuration/schema

prSections:
  - title: My Pull Requests
    filters: is:open author:@me

  - title: Needs My Review
    # GitHub search's repo: qualifier has no wildcard support, so
    # "elhub/test-suite*" and "elhub/service-platform-*" (except -web-api
    # and the bare service-platform repo, both kept) are enumerated
    # explicitly. Repos as of 2026-08-18:
    # `gh repo list elhub --limit 1000 --json name -q '.[].name' | grep
    # "^test-suite"` / `| grep "^service-platform"` — re-run and update
    # this list if new ones appear.
    filters: >-
      is:open
      review-requested:@me
      -repo:elhub/auth-test-token-service
      -repo:elhub/auth-vault-transit-secrets-engine-mock
      -repo:elhub/service-platform-aag-policy
      -repo:elhub/service-platform-ansible-collection-deploy
      -repo:elhub/service-platform-bpm-ht-services
      -repo:elhub/service-platform-bpm-services
      -repo:elhub/service-platform-database
      -repo:elhub/service-platform-java-services
      -repo:elhub/service-platform-jlib-calendar-utils
      -repo:elhub/service-platform-jlib-config-utils
      -repo:elhub/service-platform-jlib-crypto-utils
      -repo:elhub/service-platform-jlib-env-utils
      -repo:elhub/service-platform-jlib-error-handler
      -repo:elhub/service-platform-jlib-lib-parent
      -repo:elhub/service-platform-jlib-logging-utils
      -repo:elhub/service-platform-jlib-meteringpoint-utils
      -repo:elhub/service-platform-jlib-osb-util
      -repo:elhub/service-platform-jlib-owsm
      -repo:elhub/service-platform-jlib-traceid-utils
      -repo:elhub/service-platform-jlib-wl-utils
      -repo:elhub/service-platform-jlib-ws-consumers
      -repo:elhub/service-platform-mds
      -repo:elhub/service-platform-oam-plugin
      -repo:elhub/service-platform-osb-deployment-maven-plugin
      -repo:elhub/service-platform-ovd-user-mapper-plugin
      -repo:elhub/service-platform-service-bus
      -repo:elhub/service-platform-services-interface-specifications
      -repo:elhub/service-platform-soa-services
      -repo:elhub/service-platform-sp-oud-user-mapper-plugin
      -repo:elhub/test-suite
      -repo:elhub/test-suite-api
      -repo:elhub/test-suite-calculation
      -repo:elhub/test-suite-emif
      -repo:elhub/test-suite-market-process
      -repo:elhub/test-suite-market-process-mass
      -repo:elhub/test-suite-metering-value
      -repo:elhub/test-suite-mypage-e2e
      -repo:elhub/test-suite-portal-security
      -repo:elhub/test-suite-structure-data
      -repo:elhub/test-suite-util
      -repo:elhub/test-suite-virtual-calculations

  - title: Reviewed By Me
    filters: >-
      is:open
      reviewed-by:@me
      -author:@me

  - title: Involved
    filters: >-
      is:open
      involves:@me
      -author:@me
      -review-requested:@me
      -reviewed-by:@me

# Local clones live flat as ~/git/<repo>, regardless of owner — matches
# herdr-sessionizer's `find ~/git -mindepth 1 -maxdepth 1`.
repoPaths:
  elhub/*: ~/git/*
  ssandoy/*: ~/git/*
  fyk-konsulenter/*: ~/git/*

defaults:
  view: prs
  # Shorter than the 30m default since this dashboard lives in an
  # always-open workspace rather than being launched on demand.
  refetchIntervalMinutes: 5
  # Don't prefill "LGTM" on the a/v approve-with-comment prompt.
  prApproveComment: ""

# `d` (view PR diff) sets GH_PAGER to this and pipes `gh pr diff` through it.
# hunk's `pager` subcommand is built for exactly this: a drop-in Git pager
# with diff detection, instead of plain `less`.
pager:
  diff: hunk pager

keybindings:
  prs:
    # a overrides the built-in Assign PR key to trigger approve instead
    # (v still approves too). A takes over what a used to do (assign),
    # giving up the default dedicated Unassign key.
    - key: a
      builtin: approve
    - key: A
      builtin: assign

    # Built-in merge has no way to fix the method, so it can prompt or fall
    # back to the repo's default. Always squash + delete the branch instead.
    - key: m
      name: squash merge (delete branch)
      command: gh pr merge {{.PrNumber}} --repo {{.RepoName}} --squash --delete-branch

    # Port of the old ghprs script's alt-s "approve + squash merge" binding
    # — a/m already cover plain approve/merge, this combines them into one
    # step. Same squash + delete-branch as the m override above.
    - key: alt+s
      name: approve + squash merge
      command: gh pr review {{.PrNumber}} --repo {{.RepoName}} --approve && gh pr merge {{.PrNumber}} --repo {{.RepoName}} --squash --delete-branch
