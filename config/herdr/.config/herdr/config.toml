# herdr configuration — migrated from config/tmux/.config/tmux/tmux.conf
# See that file's history for the source of truth being replaced here.

[theme]
name = "catppuccin"
# tmux used the "macchiato" flavour via mike-rambil/tmux-catppuccin; herdr's
# built-in catppuccin theme doesn't expose separate flavour variants (just
# "catppuccin" / "catppuccin-latte" for dark/light), so this is an approximation.

[ui]
# Matches the old pane-active-border-style 'fg=magenta'.
accent = "magenta"

agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false
[advanced]
# tmux had history-limit = 1,000,000 *lines*; herdr's limit is in *bytes*, so
# there's no exact conversion. Bumped up from the 10MB default as a rough match.
scrollback_limit_bytes = 50_000_000

[keys]
prefix = "ctrl+a"

# Cycle workspaces with prefix+tab / prefix+shift+tab. This claims the keys
# that default to cycle_pane_next/cycle_pane_previous (pane cycling within a
# tab) — workspace cycling wins here since that's what was asked for.
next_workspace = "prefix+tab"
previous_workspace = "prefix+shift+tab"

# --- Direct (no-prefix) bindings, matching the old `bind-key -n` set ---
# tmux's -v/-h split flags name the *divider axis*; herdr's split_vertical/
# split_horizontal name the *resulting pane arrangement* (the more common
# vim/VS Code convention) — the opposite way round. Swapped to match the
# actual old behavior: C-s -> stacked panes, C-t -> side-by-side panes.
split_vertical = "ctrl+t"    # was: bind-key -n C-t split-window -h (side-by-side)
split_horizontal = "ctrl+s"  # was: bind-key -n C-s split-window -v (stacked)
close_pane = "ctrl+w"        # was: bind-key -n C-w kill-pane
close_workspace = "ctrl+q"   # was: bind-key -n C-Q kill-session

# herdr's actual defaults for these are vim-style prefix+h/j/k/l, not arrow
# keys — there was no old tmux binding for this either (tmux.conf had no
# select-pane -L/-R/-U/-D bindings). Setting these explicitly replaces the
# h/j/k/l defaults with arrows rather than adding a second binding, since
# each of these actions takes exactly one key.
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# Old config bound the same "session browser" popup to prefix+s, ctrl+tab, AND
# a Windows-Terminal-only escape sequence (user-keys[0]). herdr reads terminal
# input directly, so none of that xterm-keys/escape-sequence plumbing is
# needed — ctrl+tab now runs the ported browser itself (see keys.command
# below) instead of herdr's built-in workspace_picker approximation.
#
# workspace_picker stays reachable on its own default (prefix+w), now that
# ctrl+tab is claimed by the real port.

reload_config = "prefix+shift+r"  # equivalent to the old `bind R source-file ... ; display-message "reloaded"`

# --- Ported custom popups, moved off keys that collide with herdr defaults ---
# (old key -> new key, and which herdr default it would've collided with)
#   b -> shift+b   (default toggle_sidebar = prefix+b)
#   o -> o         (default open_notification_target = prefix+o, overridden below —
#                   muscle memory for the project picker won out over this default)
#   g -> alt+g     (default goto = prefix+g)
#   r -> alt+r     (default resize_mode = prefix+r)
#   t -> t         (no default collision)
open_notification_target = ""  # freed so prefix+o can drive the sessionizer instead

[[keys.command]]
key = "prefix+shift+b"
type = "pane"
command = "$HOME/.config/herdr/herdr-file-selector"

[[keys.command]]
key = "prefix+t"
type = "pane"
command = "zsh -l"

# Jumps to the dedicated "github" workspace running gh-dash (tabbed overview
# + one-key actions across repos).
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "$HOME/.config/herdr/herdr-github"

# gh-dash has no local/incremental filter over already-fetched PRs (its `/`
# always re-queries GitHub). ghprs fetches once and hands rows to fzf for
# real type-ahead filtering, so it's kept as gh-dash's search companion.
[[keys.command]]
key = "prefix+alt+f"
type = "pane"
command = "zsh -lic ghprs"

[[keys.command]]
key = "ctrl+tab"
type = "pane"
command = "$HOME/.config/herdr/herdr-session-browser"

[[keys.command]]
key = "prefix+o"
type = "pane"
command = "$HOME/.config/herdr/herdr-sessionizer"

[[keys.command]]
key = "prefix+alt+r"
type = "pane"
command = "rg --color=always --line-number --no-heading --smart-case \"${*:-}\" | fzf --ansi --color --delimiter : --preview \"bat --style=numbers --color=always {1} --highlight-line {2}\" --bind \"enter:become(vim {1} +{2})\""

# --- Not migrated ---
# `bind n` (navi cheat-sheet popup that pasted the pick into the calling pane):
# navi isn't even installed on this machine, and reimplementing the
# "popup picks something, then injects it into the pane that spawned the
# popup" behavior needs a way to address that original pane from within a
# `[[keys.command]]` process. Herdr injects $HERDR_PANE_ID into managed panes,
# but that identifies the pane the command is *running in* (the new popup/pane),
# not the one that triggered it — there's no verified mechanism yet for the
# reverse. Revisit if/when navi gets installed and this is worth solving.
#
# cpu/battery/kube-context status-bar modules (tmux-battery, tmux-cpu,
# kube-tmux): herdr's sidebar has no equivalent system-stat module slot today.

[ui.toast]
delivery = "herdr"
