source-file ~/.config/tmux/tmux.reset.conf

set-option -g default-terminal 'tmux-256color'
set-option -ag terminal-overrides ',xterm-256color:RGB'
set-option -as terminal-features ',xterm-256color:RGB:extkeys'
set-option -g xterm-keys on
set-option -g mouse on
set-option -g display-time 4000

# Ensure zsh configuration loads properly
set-option -g default-shell /bin/zsh
set-option -g default-command "zsh -l"

set -g prefix C-a            # rebind the prefix to ctrl+a
set -s extended-keys on      # recognize modified keys from terminals
set -s extended-keys-format csi-u
set -s user-keys[0] "\e[9;5u" # Windows Terminal Ctrl+Tab escape sequence
set -s user-keys[1] "\e[9;6u" # Windows Terminal Ctrl+Shift+Tab escape sequence
set -g status-interval 2     # refresh state every 2 seconds
set -g base-index 1          # start indexing windows at 1 instead of 0
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g escape-time 0         # zero-out escape time delay
set -g history-limit 1000000 # increase history size (from 2,000)
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
set -g allow-passthrough on  # forward OSC notifications to Ghostty
set -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g status-position top
set -g status 2
# tmux padding is row-based; keep one blank row below the top status line.
set -g status-format[1] '#[bg=default]'

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'jonmosco/kube-tmux'


# tmux-fzf configuration
set-environment -g TMUX_FZF_OPTIONS "-p -w 90% -h 90% -m"

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @override_copy_command 'xclip -selection clipboard'

# Catppuccin
# Reset cached theme variables first so changing flavor works on config reload.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_reset 'true'
run '~/.local/share/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Reapply custom options cleared by Catppuccin's reset pass.
set -g @catppuccin_flavor 'mocha'
# Match Windows Terminal while giving rounded separators a concrete base color.
set -g @catppuccin_status_background '#{@thm_bg}'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# Load the customized theme before expanding its status modules.
run '~/.local/share/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"

bind-key b run-shell -b "$HOME/.config/tmux/tmux-file-selector"
bind t popup -d "#{pane_current_path}" -w90% -h90% -E "TMUX_POPUP_SHELL=1 zsh -l"
bind g popup -d "#{pane_current_path}" -w90% -h90% -E "GHPRS_IN_POPUP=1 zsh -lic ghprs"
bind o popup -w70% -h40% -E $HOME/.config/tmux/tmux-sessionizer
bind n popup -w90% -h90% -E 'window=$(tmux display -p -F "#S:#I.#P") && export FZF_DEFAULT_OPTS="-m --layout=reverse --border" && navi --print | tr -d "\n" | tmux load-buffer -b tmp - && tmux paste-buffer -drp -t $window -b tmp'
bind r popup -w90% -h90% -E 'rg --color=always --line-number --no-heading --smart-case "${*:-}" | fzf --ansi --color --delimiter : --preview "bat --style=numbers --color=always {1} --highlight-line {2}" --bind "enter:become(vim {1} +{2})"'

bind s run-shell -b "$HOME/.config/tmux/tmux-session-browser --popup '#{client_name}'" # prefix+s → fzf session picker
bind-key -n C-Tab run-shell -b "$HOME/.config/tmux/tmux-session-browser --popup '#{client_name}'"
bind-key -n User0 run-shell -b "$HOME/.config/tmux/tmux-session-browser --popup '#{client_name}'"
bind-key -n C-S-Tab run-shell -b "$HOME/.config/tmux/tmux-session-browser --popup '#{client_name}'"
bind-key -n User1 run-shell -b "$HOME/.config/tmux/tmux-session-browser --popup '#{client_name}'"
bind-key -n C-s split-window -v -c "#{session_path}"
bind-key -n C-t split-window -h -c "#{session_path}"
bind-key -n C-w kill-pane
bind-key -n C-S-q kill-session

bind R source-file ~/.config/tmux/tmux.conf \; display-message "✨ Config reloaded..."

# Run the plugins
run '~/.local/share/tmux/plugins/tpm/tpm'
